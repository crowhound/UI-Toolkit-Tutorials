- uid: SF.UIModule.UIController.OnUIControllerUIReloaded(UnityEngine.UIElements.PanelRenderer,UnityEngine.UIElements.VisualElement,System.Int32)
  commentId: M:SF.UIModule.UIController.OnUIControllerUIReloaded(UnityEngine.UIElements.PanelRenderer,UnityEngine.UIElements.VisualElement,System.Int32)
  id: OnUIControllerUIReloaded(UnityEngine.UIElements.PanelRenderer,UnityEngine.UIElements.VisualElement,System.Int32)
  parent: SF.UIModule.UIController
  langs:
  - csharp
  - vb
  name: OnUIControllerUIReloaded(PanelRenderer, VisualElement, int)
  nameWithType: UIController.OnUIControllerUIReloaded(PanelRenderer, VisualElement, int)
  fullName: SF.UIModule.UIController.OnUIControllerUIReloaded(UnityEngine.UIElements.PanelRenderer, UnityEngine.UIElements.VisualElement, int)
  type: Method
  assemblies:
  - SF.Packages
  namespace: SF.UIModule
  summary: >-
    Called when the <xref href="SF.UIModule.UIController._panelRenderer" data-throw-if-not-resolved="false"></xref> Panel Settings or properties change, or when the component is enabled.

    Important to prevent double callbacks. Unity also calls this once when the Panel Render is first created during the scene start up they are in.

    So Panel Render calls this once during scene start than again during OnEnable the normal OnEnable only at the first frame of the scene the Panel Render is in.

    So frame one of new scene loaded calls this twice. Be careful to not double any list or collection because of this.
  example: []
  syntax:
    content: protected abstract void OnUIControllerUIReloaded(PanelRenderer panelRenderer, VisualElement rootElement, int version)
    parameters:
    - id: panelRenderer
      type: UnityEngine.UIElements.PanelRenderer
      description: ''
    - id: rootElement
      type: UnityEngine.UIElements.VisualElement
      description: ''
    - id: version
      type: System.Int32
      description: ''
    content.vb: Protected MustOverride Sub OnUIControllerUIReloaded(panelRenderer As PanelRenderer, rootElement As VisualElement, version As Integer)
  overload: SF.UIModule.UIController.OnUIControllerUIReloaded*
  nameWithType.vb: UIController.OnUIControllerUIReloaded(PanelRenderer, VisualElement, Integer)
  fullName.vb: SF.UIModule.UIController.OnUIControllerUIReloaded(UnityEngine.UIElements.PanelRenderer, UnityEngine.UIElements.VisualElement, Integer)
  name.vb: OnUIControllerUIReloaded(PanelRenderer, VisualElement, Integer)
