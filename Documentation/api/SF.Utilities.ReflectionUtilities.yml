- uid: SF.Utilities.ReflectionUtilities.GetParentObject(System.String,System.Object)
  commentId: M:SF.Utilities.ReflectionUtilities.GetParentObject(System.String,System.Object)
  id: GetParentObject(System.String,System.Object)
  parent: SF.Utilities.ReflectionUtilities
  langs:
  - csharp
  - vb
  name: GetParentObject(string, object)
  nameWithType: ReflectionUtilities.GetParentObject(string, object)
  fullName: SF.Utilities.ReflectionUtilities.GetParentObject(string, object)
  type: Method
  assemblies:
  - SF.Packages
  namespace: SF.Utilities
  summary: >-
    Get the object owner of a field.  This method processes
        the '.' separator to get from the object that owns the compound field
        to the object that owns the leaf field
  remarks: The type of object mentioned here is C# lowercase object, not Unity's uppercase Object type.
  example: []
  syntax:
    content: public static object GetParentObject(string path, object obj)
    parameters:
    - id: path
      type: System.String
      description: The name of the field, which may contain '.' separators
    - id: obj
      type: System.Object
      description: the owner of the compound field
    return:
      type: System.Object
      description: The object owner of the field
    content.vb: Public Shared Function GetParentObject(path As String, obj As Object) As Object
  overload: SF.Utilities.ReflectionUtilities.GetParentObject*
  nameWithType.vb: ReflectionUtilities.GetParentObject(String, Object)
  fullName.vb: SF.Utilities.ReflectionUtilities.GetParentObject(String, Object)
  name.vb: GetParentObject(String, Object)
