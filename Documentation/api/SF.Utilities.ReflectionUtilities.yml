  name: GetFieldPath<TType, TValue>(Expression<Func<TType, TValue>>)
  nameWithType: ReflectionUtilities.GetFieldPath<TType, TValue>(Expression<Func<TType, TValue>>)
  fullName: SF.Utilities.ReflectionUtilities.GetFieldPath<TType, TValue>(System.Linq.Expressions.Expression<System.Func<TType, TValue>>)
  type: Method
  assemblies:
  - SF.Packages
  namespace: SF.Utilities
  summary: >-
    Returns a string path from an expression - mostly used to retrieve serialized properties
        without hardcoding the field path. Safer, and allows for proper refactoring.
  example: []
  syntax:
    content: public static string GetFieldPath<TType, TValue>(Expression<Func<TType, TValue>> expr)
    parameters:
    - id: expr
      type: System.Linq.Expressions.Expression{System.Func{{TType},{TValue}}}
      description: Magic expression
    typeParameters:
    - id: TType
      description: Magic expression
    - id: TValue
      description: Magic expression
    return:
      type: System.String
      description: The string version of the field path
    content.vb: Public Shared Function GetFieldPath(Of TType, TValue)(expr As Expression(Of Func(Of TType, TValue))) As String
