  fullName: SF.UIElements.ListViewUtilities.ListViewBaseName
  type: Field
  assemblies:
  - SF.Packages
  namespace: SF.UIElements
  summary: >-
    This is the base part of a <xref href="UnityEngine.UIElements.ListView" data-throw-if-not-resolved="false"></xref> name when generated by a property field.

    <remarks>
     Just add the name of the property list being shown by the ListView with a dash in
    front of it to get the Unity generated name of the ListView.

    Example a List of a C# object called WeaponProperties will be name

    unity-list-WeaponProperties

    </remarks>
  example: []
  syntax:
    content: public const string ListViewBaseName = "unity-list"
    return:
      type: System.String
    content.vb: Public Const ListViewBaseName As String = "unity-list"
