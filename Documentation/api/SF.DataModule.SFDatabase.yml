- uid: SF.DataModule.SFDatabase.DatabaseLoadOrder
  commentId: F:SF.DataModule.SFDatabase.DatabaseLoadOrder
  id: DatabaseLoadOrder
  parent: SF.DataModule.SFDatabase
  langs:
  - csharp
  - vb
  name: DatabaseLoadOrder
  nameWithType: SFDatabase.DatabaseLoadOrder
  fullName: SF.DataModule.SFDatabase.DatabaseLoadOrder
  type: Field
  assemblies:
  - SF.Packages
  namespace: SF.DataModule
  summary: >-
    The order of important in which databases are loaded. Allows making sure certain databases are loaded first.

    The lower the number the earlier it is loaded.
  example: []
  syntax:
    content: public int DatabaseLoadOrder
    return:
      type: System.Int32
    content.vb: Public DatabaseLoadOrder As Integer
- uid: SF.DataModule.SFDatabase.OnRegisterDatabase
  commentId: M:SF.DataModule.SFDatabase.OnRegisterDatabase
  id: OnRegisterDatabase
  parent: SF.DataModule.SFDatabase
  langs:
  - csharp
  - vb
  name: OnRegisterDatabase()
  nameWithType: SFDatabase.OnRegisterDatabase()
  fullName: SF.DataModule.SFDatabase.OnRegisterDatabase()
  type: Method
  assemblies:
  - SF.Packages
  namespace: SF.DataModule
  summary: >-
    SFDatabases are registered by the <xref href="SF.DataModule.DatabaseRegistry" data-throw-if-not-resolved="false"></xref> which is loaded during the player start up

    as part of the preloaded assets set in the project's PlayerSettings via SetPreloadedAssets.

    So there OnEnable runs when the runtime player starts and is guaranteed to run before anything scene related.
  example: []
  syntax:
    content: public virtual void OnRegisterDatabase()
    content.vb: Public Overridable Sub OnRegisterDatabase()
  overload: SF.DataModule.SFDatabase.OnRegisterDatabase*
