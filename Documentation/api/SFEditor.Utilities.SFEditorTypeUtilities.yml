  namespace: SFEditor.Utilities
  summary: >-
    Recursive scan that invokes a handler for all serializable fields that reference a MonoBehaviour.

    This involves native code used in Unity's <xref href="UnityEditor.TypeCache" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static bool RecursiveUpdateBehaviourReferences(GameObject go, SFEditorTypeUtilities.ReferenceUpdater updater)
    parameters:
    - id: go
      type: UnityEngine.GameObject
    - id: updater
      type: SFEditor.Utilities.SFEditorTypeUtilities.ReferenceUpdater
    return:
      type: System.Boolean
    content.vb: Public Shared Function RecursiveUpdateBehaviourReferences(go As GameObject, updater As SFEditorTypeUtilities.ReferenceUpdater) As Boolean
