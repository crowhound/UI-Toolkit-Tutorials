  langs:
  - csharp
  - vb
  name: GetTypesDerivedFrom(Type, Predicate<Type>)
  nameWithType: SFEditorTypeUtilities.GetTypesDerivedFrom(Type, Predicate<Type>)
  fullName: SFEditor.Utilities.SFEditorTypeUtilities.GetTypesDerivedFrom(System.Type, System.Predicate<System.Type>)
  type: Method
  assemblies:
  - SFeditor.Packages
  namespace: SFEditor.Utilities
  summary: Search all assemblies for all types that match a predicate
  example:
  - >-
    <pre><code class="lang-csharp">var allSources = ReflectionHelpers.GetTypesDerivedFrom(inputType,
                        (t) =&gt; !t.IsAbstract and
                        typeof(MonoBehaviour).IsAssignableFrom(t).GetCustomAttribute&lt;ObsoleteAttribute&gt;() == null);</code></pre>
  syntax:
    content: public static List<Type> GetTypesDerivedFrom(Type type, Predicate<Type> predicate)
    parameters:
    - id: type
      type: System.Type
      description: The type or interface to look for
    - id: predicate
      type: System.Predicate{System.Type}
      description: Additional conditions to test
    return:
      type: System.Collections.Generic.List{System.Type}
      description: A list of types found that inherit from the type and satisfy the predicate.
    content.vb: Public Shared Function GetTypesDerivedFrom(type As Type, predicate As Predicate(Of Type)) As List(Of Type)
