  namespace: SF.UIModule
  summary: >-
    The wrapper class for anything that controls the logic of an <xref href="SF.UIModule.UIView" data-throw-if-not-resolved="false"></xref> or a class that inherits from <xref href="SF.UIModule.UIView" data-throw-if-not-resolved="false"></xref>.

    <remarks>
    	There can be multiple UIController using the same <xref href="UnityEngine.UIElements.UIDocument" data-throw-if-not-resolved="false"></xref>.
    	Example the main menu has sub <xref href="SF.UIModule.UIView" data-throw-if-not-resolved="false"></xref> that display a specific menu like inventory, options, and ect.
    	Depending on the submenu it might have its own UIController class for its logic.
    </remarks>
  example: []
  syntax:
    content: 'public abstract class UIControllerBase : MonoBehaviour'
    content.vb: Public MustInherit Class UIControllerBase Inherits MonoBehaviour
