    Simple PlayerHUD with a <xref href="SF.UIModule.PlayerHUD._healthBarRef" data-throw-if-not-resolved="false"></xref> that has data binding to allow button to decrease/increase

    the player health bar fill as the health changes.

    See <xref href="SF.Damageable.HealthBase" data-throw-if-not-resolved="false"></xref> for the class used as the data source for the binding.
