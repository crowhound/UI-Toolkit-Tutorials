  namespace: SF.Utilities.Shapes
  summary: The base class for all SF Shapes.
  remarks: >-
    This class is not marked as abstract so it can be instantiated than assigned to on the fly

    while the initial instantiation can implement a constructor.


    It also will use a struct for shape data to allow for some performance and memory usages when copying it's path data into stuff like Unity's UnityEngine.PhysicsShape2D class.
