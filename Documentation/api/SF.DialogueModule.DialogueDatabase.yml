  name: OnRegisterDatabase()
  nameWithType: DialogueDatabase.OnRegisterDatabase()
  fullName: SF.DialogueModule.DialogueDatabase.OnRegisterDatabase()
  type: Method
  assemblies:
  - SF.Packages
  namespace: SF.DialogueModule
  summary: >-
    SFDatabases are registered by the <xref href="SF.DataModule.DatabaseRegistry" data-throw-if-not-resolved="false"></xref> which is loaded during the player start up

    as part of the preloaded assets set in the project's PlayerSettings via SetPreloadedAssets.

    So there OnEnable runs when the runtime player starts and is guaranteed to run before anything scene related.
