  fullName: SF.Utilities.MathUtilities.TransformExtensions.RotateToTargetView(UnityEngine.Transform, UnityEngine.Transform, UnityEngine.Vector3)
  type: Method
  assemblies:
  - SF.Packages
  namespace: SF.Utilities.MathUtilities
  summary: >-
    Rotates the Transform of the calling transform to look at the view targeted object and align its rotation up with it.

    Both passed in values should be in the same space (world/local). If one is world space then the other should be as well.
  example: []
  syntax:
    content: public static void RotateToTargetView(this Transform transform, Transform viewTargetTransform, Vector3 upDirection)
    parameters:
    - id: transform
      type: UnityEngine.Transform
      description: ''
    - id: viewTargetTransform
      type: UnityEngine.Transform
      description: ''
    - id: upDirection
      type: UnityEngine.Vector3
      description: ''
      attributes:
      - type: UnityEngine.Internal.DefaultValueAttribute
        ctor: UnityEngine.Internal.DefaultValueAttribute.#ctor(System.String)
        arguments:
        - type: System.String
          value: Vector.up
    content.vb: Public Shared Sub RotateToTargetView(transform As Transform, viewTargetTransform As Transform, upDirection As Vector3)
  overload: SF.Utilities.MathUtilities.TransformExtensions.RotateToTargetView*
