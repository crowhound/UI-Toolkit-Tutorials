- uid: SF.UIModule.UIView.IsInstancedUXMLTemplate
  commentId: F:SF.UIModule.UIView.IsInstancedUXMLTemplate
  id: IsInstancedUXMLTemplate
  parent: SF.UIModule.UIView
  langs:
  - csharp
  - vb
  name: IsInstancedUXMLTemplate
  nameWithType: UIView.IsInstancedUXMLTemplate
  fullName: SF.UIModule.UIView.IsInstancedUXMLTemplate
  type: Field
  assemblies:
  - SF.Packages
  namespace: SF.UIModule
  summary: >-
    If the UView's uxml structure is being instantiated via Templates inside an uxml file.

    If this is set to true the parent of the passed in root object will be used for show/hide

    by declaring the <xref href="UnityEngine.UIElements.TemplateContainer" data-throw-if-not-resolved="false"></xref> in the initialize as the root object
  remarks: When <xref href="UnityEngine.UIElements.TemplateContainer" data-throw-if-not-resolved="false"></xref> are used it is sometimes better to set the <xref href="UnityEngine.UIElements.TemplateContainer" data-throw-if-not-resolved="false"></xref> as the root object.
  example: []
  syntax:
    content: >-
      [NonSerialized]

      public bool IsInstancedUXMLTemplate
    return:
      type: System.Boolean
    content.vb: >-
      <NonSerialized>

      Public IsInstancedUXMLTemplate As Boolean
  attributes:
