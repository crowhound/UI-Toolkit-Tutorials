  langs:
  - csharp
  - vb
  name: UIView
  nameWithType: UIView
  fullName: SF.UIModule.UIView
  type: Class
  assemblies:
  - SF.Packages
  namespace: SF.UIModule
  summary: >-
    Initializes the uxml/visual element assets for a set of UI elements that make up a UI menu/view

    and registers the needed events in them.
  remarks: >-
    Multiple views are able to be on screen at once. Each UI View can have UI views in them as sub views.

    Each UIView can be seen as an organized set of UI elements that focus on a certain feature or function.

    Examples: Each view of the setting menu, the main menu contains several UI views, title screen, and overlays.


    Each UI View has an <xref href="SF.UIModule.UIController" data-throw-if-not-resolved="false"></xref> for logic that contains the events the UIViews register listens for.

    Note each <xref href="SF.UIModule.UIController" data-throw-if-not-resolved="false"></xref> can control multiple UIViews. Think about the main menu and how it has logic for the side

    buttons to open different sub views like inventory, settings, and journal.
  example: []
  syntax:
    content: >-
      [Serializable]

      public class UIView : IUIView
    content.vb: >-
      <Serializable>

      Public Class UIView Implements IUIView
  inheritance:
  - System.Object
  implements:
  - SF.UIModule.IUIView
  attributes:
  - type: System.SerializableAttribute
    ctor: System.SerializableAttribute.#ctor
    arguments: []
