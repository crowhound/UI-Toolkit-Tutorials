  name: TimedDialogueEntry
  nameWithType: TimedDialogueEntry
  fullName: SF.DialogueModule.TimedDialogueEntry
  type: Class
  assemblies:
  - SF.Packages
  namespace: SF.DialogueModule
  summary: >-
    A class to allow DialogueEntries can have an action that can be called if

    the user stays on the dialogue for a set amount of time.
  remarks: This allows for having special dialogue that calls events if the player hesitates to take an action or make a choice.
  example: []
  syntax:
    content: 'public class TimedDialogueEntry : DialogueEntry'
    content.vb: Public Class TimedDialogueEntry Inherits DialogueEntry
  inheritance:
  - System.Object
  - SF.DialogueModule.DialogueEntry
  inheritedMembers:
